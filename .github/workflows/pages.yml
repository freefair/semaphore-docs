name: Docs Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build all locales
    runs-on: ubuntu-latest
    env:
      DOCS_URL: https://freefair.io
      DOCS_BASE_URL: /semaphore-docs/
      DOCS_ORGANIZATION: freefair

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Serial build by policy: eleven locales, measured ~5 GB peak RSS.
      - name: Build site
        run: npm run build

      - name: Verify navigation and canonical security fallbacks
        env:
          DOCS_BUILD_DIR: build
        run: node --test tests/full-product-navigation.test.cjs tests/security-fallbacks.test.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
